<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Front Office GM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky scoreboard header with phase actions, scrollable tab strip, one working panel per tab */
:root{
  --bg:#eceff4; --surface:#ffffff; --sunk:#f4f6f9; --ink:#141a24; --muted:#5b6577; --line:#d6dbe4;
  --accent:#2244c9; --accent-ink:#ffffff; --you:#fff1e6; --you-line:#e8772e;
  --good:#17804a; --bad:#bf3229; --warn:#a86a00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e5e9f0; --muted:#97a1b3; --line:#283243;
  --accent:#7f99ff; --accent-ink:#0b1020; --you:#2a1d14; --you-line:#f0934f;
  --good:#4cc283; --bad:#ff7a6e; --warn:#e2a93b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e5e9f0; --muted:#97a1b3; --line:#283243;
  --accent:#7f99ff; --accent-ink:#0b1020; --you:#2a1d14; --you-line:#f0934f;
  --good:#4cc283; --bad:#ff7a6e; --warn:#e2a93b; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.5rem}
h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
button,select{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.45rem .8rem;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:.2rem .55rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .6rem;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem;padding-block:.65rem}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.chip{display:inline-grid;place-items:center;min-width:2.6em;height:1.9em;padding:0 .35em;border-radius:4px;color:#fff;font-family:var(--display);font-weight:700;letter-spacing:.04em;font-size:.95rem}
.brand .tn{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.1}
.brand .sub{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.score{display:flex;gap:1.1rem;align-items:baseline}
.score div{display:flex;flex-direction:column}
.score b{font-family:var(--display);font-size:1.5rem;line-height:1}
.score span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-left:auto}
.capbar{flex-basis:100%;display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:var(--muted)}
.meter{position:relative;flex:1;max-width:420px;height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter i.over{background:var(--warn)} .meter i.tax{background:var(--bad)}
.meter u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}

.tabs{display:flex;gap:.2rem;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs .wrap{display:flex;gap:.15rem;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);padding:.6rem .7rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--you-line)}
.main{padding-block:1.2rem 3rem;display:grid;gap:1.2rem}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1.2rem}
.grid2>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem;display:grid;gap:.75rem;align-content:start;min-width:0}
.panel p{margin:0;max-width:75ch}
.callout{border-left:4px solid var(--you-line);background:var(--you)}
.tf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:.6rem .8rem;margin:.6rem 0}
.tf-grid label{display:grid;gap:.2rem;font-size:.82rem;color:var(--muted);font-weight:600}
.tf-grid select,.tf-grid input:not([type=checkbox]){width:100%;min-width:0;box-sizing:border-box}
.tf-pair{display:flex;gap:.3rem;align-items:center}.tf-pair input{flex:1}
.tf-checks{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin:.4rem 0}
.tf-checks label{display:inline-flex;gap:.35rem;align-items:center;font-size:.9rem;cursor:pointer}
.btn.tog.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:.6rem}
.dc-col{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;display:grid;gap:.25rem;align-content:start;min-width:0}
.dc-col h4{margin:0;display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.dc-col div{font-size:.88rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 .4rem;align-items:baseline}
.dc-col div b{text-align:right}.dc-col div small{grid-column:1/-1;margin-top:-.15rem}
.needs{list-style:none;padding:0;margin:0;display:grid;gap:.45rem}
.needs li{display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:center;font-size:.92rem}
.trend{font-size:.65rem;margin-left:.1rem}
.cmp td,.cmp th{text-align:center}.cmp td:first-child,.cmp th:first-child{text-align:left}
.cmp .win{font-weight:700;color:var(--good)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:right;padding:.35rem .45rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.35rem .45rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
th.sort{cursor:pointer} th[title]:not(.sort){cursor:help}
tr.you td{background:var(--you)}
tr.cut td{border-bottom:2px dashed var(--muted)}
tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ovr{font-family:var(--display);font-weight:700;font-size:1.05rem}
.pill{display:inline-block;padding:.05rem .45rem;border-radius:99px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor}
.box-score{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1rem}
.final{display:flex;align-items:center;gap:1rem;font-family:var(--display);font-size:1.6rem;font-weight:700}
.news{margin:0;padding:0;list-style:none;display:grid;gap:.4rem;font-size:.9rem}
.news li{display:flex;gap:.6rem}
.news li span:first-child{color:var(--muted);min-width:3.2em;font-variant-numeric:tabular-nums}
/* Home: news sits beside the main column on wide screens, right under the desk callout on narrow ones */
.home,.home-top,.home-rest{display:grid;gap:1.2rem;min-width:0}
.home-side .news{max-height:18rem;overflow-y:auto;padding-right:.3rem}
@media (min-width:1100px){
  .home{grid-template-columns:minmax(0,1fr) minmax(300px,400px);align-items:start}
  .home-top{grid-column:1;grid-row:1} .home-rest{grid-column:1;grid-row:2}
  .home-side{grid-column:2;grid-row:1 / span 2;position:sticky;top:calc(var(--hdr,0px) + 1rem);max-height:calc(100vh - var(--hdr,0px) - 2rem);grid-template-rows:auto minmax(0,1fr)}
  .home-side .news{max-height:none;min-height:0}
}
.modal.wide{width:min(1100px,100%)}
.lv-board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.8rem;padding:.6rem;background:var(--sunk);border:1px solid var(--line);border-radius:8px}
.lv-team{display:grid;justify-items:center;gap:.15rem;text-align:center}
.lv-team.you .lv-nick{font-weight:700}
.lv-pts{font-family:var(--display);font-size:2.6rem;line-height:1}
.lv-mid{display:grid;justify-items:center;gap:.25rem;font-weight:600;color:var(--muted)}
.lv-clock{font-family:var(--display);font-size:1.7rem;color:var(--ink);min-width:4.5ch;text-align:center}
.lv-gw{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--good);margin:0}
.ebar{display:inline-block;width:64px;height:7px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden;vertical-align:middle}
.ebar i{display:block;height:100%;background:var(--good)} .ebar i.low{background:var(--warn)}
.pbp.lv-feed{max-height:20rem} .lv-feed .clk{white-space:nowrap} .pbp.lv-feed li{grid-template-columns:5.2em auto 1fr auto}
.pbp li.gw{background:var(--you)}
.pbp li.gw .txt{color:var(--good)}
@media (max-width:560px){.ebar{width:40px}.lv-pts{font-size:2rem}.lv-clock{font-size:1.3rem}.lv-board{gap:.4rem;padding:.5rem}.pbp.lv-feed li{grid-template-columns:auto auto 1fr auto;gap:.4rem}}
td.win{font-weight:700}
.lead-chart{display:grid;gap:.3rem}
.lead-chart svg{width:100%;height:160px;display:block;background:var(--sunk);border:1px solid var(--line);border-radius:6px}
.lead-chart .grid{stroke:var(--line);vector-effect:non-scaling-stroke}
.lead-chart .zero{stroke:var(--muted);stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.lead-chart .trace{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.lead-key{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.lead-q{position:relative;height:1.1rem;font-size:.75rem;color:var(--muted)}
.lead-q span{position:absolute;transform:translateX(-50%)}
.pbp{list-style:none;margin:0;padding:0 .3rem 0 0;max-height:26rem;overflow-y:auto;border:1px solid var(--line);border-radius:6px;font-size:.88rem}
.pbp li{display:grid;grid-template-columns:3.2em auto 1fr auto;gap:.6rem;align-items:center;padding:.3rem .6rem;border-bottom:1px solid var(--line)}
.pbp li .chip{font-size:.75rem;min-width:2.4em;height:1.6em}
.pbp li.sc .txt{font-weight:600}
.pbp li.per{display:block;position:sticky;top:0;background:var(--sunk);font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--muted)}
.pbp .clk{color:var(--muted)}
td.acts{white-space:normal;min-width:14rem;max-width:21rem}
td.acts .btn,td.acts .pill{margin-block:.1rem}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:1rem;min-width:720px}
.series{border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;display:grid;gap:.2rem;background:var(--surface);font-size:.9rem}
.series div{display:flex;justify-content:space-between;gap:.5rem}
.series .w{font-weight:700}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:.6rem}
.pick{display:flex;gap:.7rem;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.7rem;border-radius:8px;cursor:pointer}
.pick:hover{border-color:var(--you-line)}
.pick small{display:block;color:var(--muted)}
.hero{padding-block:2rem 1rem;display:grid;gap:.5rem;max-width:62ch}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:6px;max-width:min(90vw,560px);z-index:20;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.check{width:1.05rem;height:1.05rem;accent-color:var(--accent)}
.plink{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.plink:hover{color:var(--accent);text-decoration-color:var(--accent)}
.modal-bg{position:fixed;inset:0;z-index:30;background:rgb(6 9 15 / .62);display:grid;place-items:start center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.2rem;width:min(820px,100%);display:grid;gap:.9rem;min-width:0}
.modal p{margin:0}
.rbars{display:grid;gap:.35rem}
.rbar{display:grid;grid-template-columns:3em 1fr 3.4em;gap:.6rem;align-items:center;font-size:.85rem}
.rbar .meter{max-width:none}
.capgrid td.ext{font-style:italic;color:var(--good)}
.capgrid tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.press{border-left:4px solid var(--accent)}
.press .q{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.25;max-width:60ch}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:.5rem}
.btn.answer{display:grid;gap:.15rem;text-align:left;white-space:normal;font-weight:600;padding:.6rem .75rem}
.btn.answer small{font-weight:400}
.rng{font-size:.82rem;white-space:nowrap;color:var(--muted)}
.opt{display:inline-flex;gap:.3rem;align-items:center;white-space:nowrap;margin-right:.4rem}
.pill.tv{color:var(--accent)}
.cup-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:.8rem}
@media (min-width:1000px){.cup-groups{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cup-groups table td,.cup-groups table th{padding:.25rem .4rem}
tr.adv td:first-child{box-shadow:inset 3px 0 var(--good)}
.bracket.cup{grid-template-columns:repeat(3,minmax(170px,1fr));min-width:540px}
.series .story{display:block;font-size:.78rem;color:var(--muted)}
.plan-in{width:8em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .5rem;border-radius:6px;font:inherit}
/* award races, awards night and lottery night */
.race-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:1rem}
.race td{white-space:normal;vertical-align:top} .race td small{font-size:.78rem}
.aw-fins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:.6rem}
.aw-fin{display:grid;gap:.3rem;justify-items:start;padding:.75rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.aw-fin b{font-family:var(--display);font-size:1.25rem;line-height:1.1}
.aw-fin.you{border-color:var(--you-line)}
.aw-fin.win{background:var(--you);border:2px solid var(--good)}
.aw-q{font-family:var(--display);font-weight:600;font-size:1.4rem;margin:0}
.aw-win{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1.1;color:var(--good);margin:0}
.aw-envelope{justify-self:start;font-size:1.05rem;padding:.7rem 1.3rem}
.aw-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1rem}
.aw-team{margin:.3rem 0 0;padding-left:1.3rem;display:grid;gap:.2rem;font-size:.92rem}
.you-name{font-weight:700}
.lot-means{list-style:none;margin:.3rem 0 0;padding:0;display:grid;gap:.3rem;font-size:.92rem}
.wrap-hero{display:grid;gap:.35rem;justify-items:start;padding:1rem;border:2px solid var(--good);border-radius:10px;background:var(--sunk)}
.wrap-hero.you{background:var(--you);border-color:var(--you-line)}
.wrap-path{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.wrap-path li{display:grid;grid-template-columns:minmax(0,11rem) 1fr auto;gap:.6rem;align-items:center;padding:.4rem .6rem;border:1px solid var(--line);border-radius:6px}
.wrap-grade{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.wrap-grade .grade{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;min-width:3.5rem;text-align:center;padding:.4rem;border:2px solid var(--line);border-radius:10px}
.wrap-grade p{margin:.15rem 0}
.wrap-grade .aw-win{color:inherit}
.wrap-list{margin:.3rem 0;padding-left:1.1rem;display:grid;gap:.2rem}
.lot-banner{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.25;min-height:2.5em;margin:0}
.lot-slots{list-style:none;margin:.3rem 0 0;padding:0;display:grid;gap:.3rem}
.lot-slots li{display:grid;grid-template-columns:2.2em 1fr auto;gap:.6rem;align-items:center;padding:.3rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--sunk);min-height:2.4rem}
.lot-slots li.on{background:var(--surface)}
.lot-slots li.top{border-color:var(--accent)}
.lot-slots li.you{background:var(--you);border-color:var(--you-line)}
.lot-slots .n{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--muted)}
.lot-slots li.top .n{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.lot-slots li.new,.aw-fin.win{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.95);opacity:.25}}}
.btn.offers-btn{display:inline-flex;align-items:center;gap:.4rem}
.btn.offers-btn .badge{display:inline-grid;place-items:center;min-width:1.35em;height:1.35em;padding:0 .3em;border-radius:99px;background:var(--you-line);color:#fff;font-size:.78rem;font-variant-numeric:tabular-nums}
.btn.offers-btn.new{border-color:var(--you-line);background:var(--you)}
.toast .btn{margin-left:.7rem;padding:.15rem .6rem;font-size:.85rem}
/* History tables that grow every season scroll inside their card, header row pinned */
.scroll.tall{max-height:24rem;overflow-y:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:.8rem}
.fcard{border:1px solid var(--line);border-radius:8px;padding:.75rem;background:var(--sunk);display:grid;gap:.55rem;align-content:start;min-width:0}
.fbar{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.fbar span{display:block;min-width:2px}
.fbar .w{background:var(--warn)}.fbar .n{background:var(--line)}.fbar .d{background:var(--good)}
.scroll.tall thead th{position:sticky;top:0;background:var(--surface);z-index:1}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
/* business dashboard: series colors (validated categorical slots 1-5), tiles, charts, tooltip */

.costs b{text-align:right}

}

function gameRecords(C,D,pts){

// ---------- season flow ----------
function simDays(n){

  for(let k=0;k<n&&S.day<S.sched.length;k++){
    const wasOpen=S.day<deadlineDay();
    for(const g of S.sched[S.day]){
      const r=simGame(g.h,g.a,true);g.hs=r.hs;g.as=r.as;g.qs=r.qs;g.top=r.top;if(r.lid)g.lid=r.lid;
      const H=T(g.h),A=T(g.a);H.pf+=r.hs;H.pa+=r.as;A.pf+=r.as;A.pa+=r.hs;
      if(r.hs>r.as){H.w++;A.l++}else{A.w++;H.l++}
      for(const [t,won] of [[H,r.hs>r.as],[A,r.as>r.hs]]){
        t.streak=won?Math.max(0,t.streak||0)+1:Math.min(0,t.streak||0)-1;
        const you=t.tid===S.userTid,n=t.streak;
        if(you?(n>=5&&n%5===0)||n===-5||n===-10:n>=15&&n%5===0)news(`${you?'Your team':'The '+tname(t.tid)} ${n>0?`won ${n} straight`:`lost ${-n} straight`}${you?'':` (${t.w}-${t.l})`}.`);
      }
      const rival=rivOf(g.h,g.a)>=RIVAL; // rivalry games sell more tickets and swing hype twice as hard
      const full=homeGame(H,g,rival); // tickets, promo nights and the crowd
      if(full<EMPTY)hypeBump(g.h,-(EMPTY-full)*1.2); // empty seats sour the mood
      dealBonus(r.hs>r.as?g.h:g.a,'perW');
      // national TV: exposure money for both sides, a little hype, and the result travels further
      const sw=(rival?2:1)*(g.tv?1.5:1);
      if(g.tv)for(const t of [H,A]){t.biz.fin.rev.tv=(t.biz.fin.rev.tv||0)+TV_REV;hypeBump(t.tid,.2)}
      hypeBump(r.hs>r.as?g.h:g.a,.4*sw);hypeBump(r.hs>r.as?g.a:g.h,-.35*sw);
      if(g.h===S.userTid||g.a===S.userTid)trackGame(g,r);
      if(g.cup&&cupOn())for(const [tid,f,a] of [[g.h,r.hs,r.as],[g.a,r.as,r.hs]]){const c=S.cup.st[tid];c.pf+=f;c.pa+=a;if(f>a)c.w++;else c.l++}
      if(Math.abs(r.hs-r.as)<=3)addRiv(g.h,g.a,1);
      if(g.h===S.userTid||g.a===S.userTid){
        const u=T(S.userTid),won=(g.h===S.userTid)===(r.hs>r.as);
        if(u.streak===-5||u.streak===-10)pressSlump(-u.streak);
        if(u.streak===7||u.streak===12)pressStreak(u.streak);
        if(S.day>=8&&S.day-(S.pressMem.beatDay??-99)>=10&&!S.presser&&rnd()<.45)pressBeat(); // the beat writers, every couple of weeks
        const opp=g.h===S.userTid?g.a:g.h,seen=S.season+':'+opp;
        if(rival&&!S.pressMem.seen[seen]&&rnd()<.5){S.pressMem.seen[seen]=1;pressRivalry(opp,won)} // once per rival per season
      }
    }
    if(cupOn())cupDay(S.day);
    accrueDay();
    if(S.day%7===6)S.teams.forEach(t=>{if(t.tid!==S.userTid)t.biz.price=goodPrice(t)}); // AI teams reprice weekly
    S.day++;
    if(S.day%16===8&&S.day<S.sched.length-3)fireBizEvent(); // a business decision every couple of weeks
    awardDay();
    if(cupOn()&&S.day<S.sched.length)cupSetup(S.day);
    if(S.day===tvFlexDay()&&S.userTid!=null){
      const before=tvCount(S.userTid)[1];pickTV(S.day+7);const after=tvCount(S.userTid)[1];
      if(after!==before)news(`The league's midseason TV flex ${after>before?`added ${after-before} national TV game${after-before>1?'s':''} to`:`took ${before-after} national TV game${before-after>1?'s':''} off`} your schedule.`);
    }
    for(let v=officeDay(S.day-1)+1;v<=officeDay(S.day);v++){
      S.vday=v;S.tick++;
      if(v%7===0)scoutWeek();
      if(S.tick%7===0)makeOffers();
      if(S.tick%4===0)aiTrades();
      rumorMill();
      freeAgents().forEach(p=>{if(p.inj&&--p.inj.g<=0)p.inj=null});
      if(v%10===0)aiExtensions(.08);
      if(v%7===3)aiFaRound(); // leftover free agents lower their price; teams with room pick them up
      if(v%7===0)updateMood();
    }
    if(wasOpen&&S.day>=deadlineDay()){news('The trade deadline has passed. Trades reopen after the playoffs.');pressDeadline()}
  }
  if(S.day>=S.sched.length)startPlayoffs();
}
function confStand(conf){return S.teams.filter(t=>t.conf===conf).sort((a,b)=>pct(b)-pct(a)||(b.pf-b.pa)-(a.pf-a.pa))}
// ---------- business ----------
// [market size 1-5, arena level 1-5]; arena level is a rough read of how modern each building is
const BIZ0={ATL:[3,4],BOS:[4,3],BKN:[4,4],CHA:[2,3],CHI:[4,3],CLE:[2,3],DET:[3,4],IND:[2,3],MIA:[3,3],MIL:[2,4],NYK:[5,4],ORL:[3,3],PHI:[4,3],TOR:[4,3],WAS:[3,3],
  DAL:[4,3],DEN:[3,3],GSW:[4,5],HOU:[4,3],LAC:[4,5],LAL:[5,4],MEM:[1,2],NOP:[1,2],OKC:[1,2],PHX:[3,4],POR:[2,2],SAC:[2,4],SAS:[2,2],UTA:[2,3],MIN:[3,4]};
const NATIONAL_TV=150; // $M per team per season from league-wide deals
const arenaCap=lvl=>17800+lvl*400;
const arenaCost=lvl=>25*lvl; // $M to go from this level to the next
const ARENA_YEARS=5,ARENA_RATE=1.1; // a financed upgrade costs 10% more, paid over five seasons
const arenaOps=lvl=>20+lvl*4;
const newFin=()=>({rev:{tickets:0,media:0,national:0,tv:0,cup:0,merch:0,sponsors:0,events:0,sharing:0,playoffs:0,taxShare:0},exp:{payroll:0,tax:0,staff:0,ops:0,arena:0,projects:0,events:0}});
const finTotal=f=>{const r=Object.values(f.rev).reduce((s,x)=>s+x,0),e=Object.values(f.exp).reduce((s,x)=>s+x,0);return {rev:r,exp:e,profit:r-e}};
function setupBusiness(){
  for(const t of S.teams){
    const [mkt,lvl]=BIZ0[t.abbr]||[3,3];
    t.biz={market:mkt,arena:lvl,arenaNext:null,hype:Math.round(clamp(30+(teamOvr(t.tid)-56)*4+mkt*5,10,90)),price:0,fin:newFin(),finHist:[],taxYears:[],loans:[],deals:{}};
    t.biz.price=goodPrice(t);
    seedDeals(t);seedFans(t);
  }
}
const fairPrice=t=>Math.round(55+t.biz.market*14+t.biz.hype*.6+t.biz.arena*8);
// how keen fans are at the fair price: hype, loyal fans, market, a modern building and the team's record
const interest=t=>.62+t.biz.hype*.003+t.biz.market*.02+(t.biz.arena-3)*.04+(winPct(t)-.5)*.25+(loyalOf(t)-50)*.002;
// how far fans will stretch past the fair price: a hot team's gate peaks above it, a cold team's below
const stretch=t=>.75+t.biz.hype*.005;
// share of seats sold at a given average ticket price; it falls off smoothly above the fair price, faster for a cold team
function demand(t,price){const f=fairPrice(t);return clamp(interest(t)*Math.exp(-(price-f)/(f*stretch(t))),.05,1)}
// season-ticket holders fill their share of seats at a price locked in each summer; single-game buyers fill the rest
const stkOf=t=>t.biz.stk??0;
const fillAt=(t,price)=>stkOf(t)+(1-stkOf(t))*demand(t,price);
const attendance=(t,price)=>Math.round(arenaCap(t.biz.arena)*fillAt(t,price));
function gateAt(t,price,boost=0){const s=stkOf(t),cap=arenaCap(t.biz.arena),walk=Math.min(1-s,(1-s)*demand(t,price)+boost);return {a:Math.round(cap*(s+walk)),rev:cap*(s*(t.biz.stp||price*.85)+walk*price)/1e6}}
function gate(tid,mult=1){const g=gateAt(T(tid),T(tid).biz.price);return {a:g.a,rev:g.rev*mult}}
const EMPTY=.7; // crowds below 70% cost hype every home game
// the price that earns the most at the gate without leaving the building too empty
function goodPrice(t){let best=20,bv=-1;for(let p=20;p<=400;p+=5){if(fillAt(t,p)<EMPTY+.02&&p>20)break;const v=gateAt(t,p).rev;if(v>bv){bv=v;best=p}}return best}
// everything that isn't a game: spread across the regular season one day at a time
function accrueDay(){
  const d=1/S.sched.length;
  for(const t of S.teams){
    const b=t.biz,f=b.fin,D=b.deals||{};
    f.rev.national+=NATIONAL_TV*d;f.rev.media+=(D.tv?D.tv.amt:0)*d;f.rev.merch+=((8+b.hype*.45+loyalOf(t)*.2+b.market*4+(b.arena-3)*4)*cityMult(t)+jerseyMerch(t.tid))*d;
    f.rev.sponsors=(f.rev.sponsors||0)+((D.patch?D.patch.amt:0)+(D.naming?D.naming.amt:0))*d;
    f.rev.sharing=(f.rev.sharing||0)+(3-b.market)*10*d; // big markets pay into revenue sharing, small markets receive
    f.exp.payroll+=payroll(t.tid)*d;f.exp.staff+=staffSpend(t.tid)*d;f.exp.arena+=arenaOps(b.arena)*d;
    f.exp.ops=(f.exp.ops||0)+(108+b.market*8)*d; // travel, front office, G League, marketing
  }
}
// 2023 CBA tax brackets: $1.50 per $1 for the first $5M over, rising; repeat taxpayers pay $1 more per bracket
function taxBill(over,repeater){
  let bill=0,rate=1.5;const steps=[1.5,1.75,2.5,3.25];
  for(let i=0;over>0;i++){const chunk=Math.min(5,over);rate=i<4?steps[i]:3.25+.5*(i-3);bill+=chunk*(rate+(repeater?1:0));over-=chunk}
  return r1(bill);
}
function chargeTax(){
  let pool=0;const payers=[];
  for(const t of S.teams){
    const over=payroll(t.tid)-TAX,rep=t.biz.taxYears.filter(y=>y>=S.season-3).length>=2;
    if(over>0){const bill=taxBill(over,rep);t.biz.fin.exp.tax+=bill;t.biz.taxYears.push(S.season);pool+=bill;payers.push(t.tid);
      if(t.tid===S.userTid)news(`You owe ${money(bill)} in luxury tax${rep?' (repeat-offender rates)':''}.`)}
  }
  const rest=S.teams.filter(t=>!payers.includes(t.tid));
  rest.forEach(t=>t.biz.fin.rev.taxShare+=pool*.5/rest.length); // half the tax pool goes to teams under the line
}
// past 85, extra excitement has nowhere to go but the loyal base (1 for 5)
const hypeBump=(tid,v)=>{const t=T(tid),b=t.biz,over=v>0?Math.max(0,b.hype+v-Math.max(85,b.hype)):0;b.hype=clamp(r1(b.hype+v),0,100);if(over>0)loyalBump(t,over*.2)};
// ---------- arena projects ----------
// extra income a season from the next level, at today's hype with a sensible ticket price
function arenaGain(t){
  const b=t.biz;if(b.arena>=5)return 0;
  const season=()=>{const p=goodPrice(t);return gateAt(t,p).rev*41+(b.arena-3)*4-arenaOps(b.arena)+b.arena*1.5};
  const now=season();b.arena++;const next=season();b.arena--;
  return r1(next-now);
}
// pay now, or finance: the first payment lands this season and the rest at the start of each new one
function startArena(tid,how,share=1){
  const b=T(tid).biz,c=arenaCost(b.arena)*share;b.arenaNext=b.arena+1;b.loans=b.loans||[];
  if(how==='cash'){b.fin.exp.projects+=c;return c}
  const amt=r1(c*ARENA_RATE/ARENA_YEARS);b.fin.exp.projects+=amt;b.loans.push({amt,left:ARENA_YEARS-1,paid:S.books||0});return amt;
}
// one payment per set of books: a loan taken in the summer already paid into the coming season
function payLoans(t){const b=t.biz,n=S.books||0;(b.loans||[]).forEach(l=>{if(l.paid===n)return;b.fin.exp.projects+=l.amt;l.left--;l.paid=n});b.loans=(b.loans||[]).filter(l=>l.left>0)}
// ---------- sponsors and local TV ----------
const DEALS=[['tv','Local TV',5],['patch','Jersey patch',4],['naming','Arena naming rights',4]];
const BRANDS=['Northwind Air','Summit Bank','Bluepeak Energy','Crestline Motors','Harbor Mutual','Ironwood Tech','Vela Mobile','Granite Insurance','Lumen Cloud','Redline Athletics','Orchard Foods','Keystone Health','Atlas Freight','Silverline Rail','Brightwater'];
const dealName=(t,k)=>k==='tv'?`${t.city} ${pick(['Sports Network','SportsNet','Channel 9','Sports Live'])}`:k==='naming'?`${pick(BRANDS)} ${pick(['Arena','Center','Fieldhouse'])}`:pick(BRANDS);
// what a deal is worth a season right now
function dealValue(t,k){const b=t.biz,w=t.hist&&t.hist[0]?t.hist[0].w:41,form=clamp((w-41)*.004,-.08,.08);
  return r1((k==='tv'?12+b.market*9+b.hype*.2:k==='patch'?3+b.market*2+b.hype*.1:3+b.market*2+b.arena*1.5+b.hype*.05)*(1+form))}
// a safe long deal, a short one that pays for wins and playoff series, and a one-year bridge to bet on a better renewal
function dealOptions(t,k){
  const v=dealValue(t,k),yrs=DEALS.find(x=>x[0]===k)[2],name=dealName(t,k);
  return [{k,kind:'safe',name,amt:v,perW:0,perS:0,exp:S.season+yrs-1},
    {k,kind:'perf',name,amt:r1(v*.6),perW:Math.round(v*12)/1000,perS:r1(v*.08),exp:S.season+(k==='tv'?2:1)},
    {k,kind:'short',name,amt:r1(v*.92),perW:0,perS:0,exp:S.season}];
}
const dealTerms=o=>`${money(o.amt)} a season${o.perW?` + ${money(o.perW)} a win + ${money(o.perS)} a playoff series won`:''}, through ${o.exp}`;
function seedDeals(t){
  t.biz.deals={};
  for(const [k,,yrs] of DEALS){const o=dealOptions(t,k)[0];o.exp=S.season+Math.floor(rnd()*yrs);t.biz.deals[k]=o}
}
// in the summer, expired deals get new offers: AI teams sign one, you choose on the Business tab
function renewDeals(){
  S.dealOffers={};
  for(const t of S.teams)for(const [k] of DEALS){
    const d=t.biz.deals[k];if(d&&d.exp>=S.season)continue;
    const opts=dealOptions(t,k);
    if(t.tid===S.userTid){S.dealOffers[k]=opts;continue}
    t.biz.deals[k]=opts[t.biz.hype>=65?1:0];
  }
  const n=Object.keys(S.dealOffers).length;
  if(n)news(`${n} sponsor deal${n>1?'s are':' is'} up for renewal. Pick the new terms on the Business tab before the season starts.`);
}
function takeDeal(k,i){
  const opts=S.dealOffers&&S.dealOffers[k];if(!opts||!opts[i])return;
  const o=opts[i];T(S.userTid).biz.deals[k]=o;delete S.dealOffers[k];
  news(`You signed a ${DEALS.find(x=>x[0]===k)[1].toLowerCase()} deal with ${o.name}: ${dealTerms(o)}.`);
}
// performance bonuses: each win, and each playoff series won
function dealBonus(tid,key){
  const b=T(tid).biz;
  for(const d of Object.values(b.deals||{})){const v=d[key];if(!v)continue;if(d.k==='tv')b.fin.rev.media+=v;else b.fin.rev.sponsors=(b.fin.rev.sponsors||0)+v}
}

// ---------- fans: loyal base, season tickets, promos, jerseys ----------
// hype is the mood this month; loyal fans are the base that sticks around, renews season tickets and pulls hype back up each summer
const loyalOf=t=>t.biz.loyal??50;
const loyalBase=t=>30+t.biz.market*5;
// share of games won this season, leaning on last season's record for the first ten games
const winPct=t=>{const g=(t.w||0)+(t.l||0),h=t.hist&&t.hist[0],lw=h?h.w/82:.5;return g>=10?t.w/g:((t.w||0)+lw*10)/(g+10)};
// gains shrink as the base grows (half speed at 75, a trickle past 90); losses land in full
function loyalBump(t,v){const b=t.biz,l=loyalOf(t);b.loyal=clamp(r1(l+(v>0?v*clamp((100-l)/50,0,1.4):v)),0,100)}
// season tickets: share of seats held after a summer renewal at a given discount
function sthForecast(t,disc=t.biz.disc??.15){
  const b=t.biz,s=b.stk??.3,f=fairPrice(t);
  const renew=clamp(.5+loyalOf(t)*.004+(b.hype-50)*.002+disc*.8-Math.max(0,b.price/f-1)*.8+(winPct(t)-.5)*.2+(b.renewAdj||0),.3,.97);
  const fresh=clamp((b.hype-40)*.002+disc*.3+loyalOf(t)*.001,0,.15);
  return {renew,fresh,next:r1(clamp(s*renew+(1-s)*fresh,.1,.75)*100)/100};

  const worst=S.teams.slice().sort((a,b)=>pct(a)-pct(b)||coin[a.tid]-coin[b.tid]).map(t=>t.tid);
  const lot=worst.filter(t=>!inPO.has(t)),odds=LOTTO_W;
  const pool=lot.map((tid,i)=>({tid,w:odds[i]||5})),top=[];
  for(let k=0;k<4;k++){const w=wpick(pool,x=>x.w);top.push(w.tid);pool.splice(pool.indexOf(w),1)}

  const orig=[...first,...worst];

  const cons=Object.fromEntries(prospects().sort((a,b)=>consensusScore(b)-consensusScore(a)).map((p,i)=>[p.pid,i+1])); // the media's final big board

    const mode=modes[p.tid],ovr=viewOvr(p).v,pot=scoutPot(p),yrs=Math.max(1,p.contract.exp-S.season+1);
    if(q&&!p.name.toLowerCase().includes(q))continue;
    if(f.pos.length&&!f.pos.includes(p.pos))continue;
    if(f.skill&&viewR(p,f.skill).v<skillBar(f.skill))continue;
    if(f.team!==''&&p.tid!==Number(f.team))continue;
    if(f.status&&mode!==f.status)continue;
    if(oMin!=null&&ovr<oMin||oMax!=null&&ovr>oMax||pMin!=null&&pot<pMin)continue;
    if(aMin!=null&&p.age<aMin||aMax!=null&&p.age>aMax)continue;
    if(sMax!=null&&p.contract.amt>sMax)continue;
    if(f.yrs==='1'&&yrs!==1||f.yrs==='2'&&yrs<2||f.yrs==='3'&&yrs<3)continue;
    if(f.leader&&!isLeader(p))continue;
    if(f.healthy&&p.inj)continue;
    const av=availOf(p,mode);if(f.avail&&av<Number(f.avail))continue;
    const role=roleForYou(ovr,mine);if(f.role!==''&&role>Number(f.role))continue;
    const up=!(best[p.pos]>=ovr);if(f.upgrade&&!up)continue;
    const val=tradeValue(p,mode,p.tid),tier=priceTier(val);if(f.price!==''&&tier>Number(f.price))continue;
    rows.push({p,mode,ovr,pot,yrs,av,role,up,val,tier,ppg:p.st.gp?p.st.pts/p.st.gp:0});
  }
  const key={name:r=>r.p.name,age:r=>r.p.age,ovr:r=>r.ovr,pot:r=>r.pot,ppg:r=>r.ppg,sal:r=>r.p.contract.amt,yrs:r=>r.yrs,price:r=>r.val,sk:r=>f.skill?viewR(r.p,f.skill).v:r.ovr}[f.sort]||(r=>r.ovr);
  rows.sort((a,b)=>{const x=key(a),y=key(b);return ((x>y?1:x<y?-1:0)*f.dir)||b.ovr-a.ovr});
  return rows;
}

function counterAsk(tid){
  const mode=teamMode(tid),sl=pickSlots(),mine=[...UI.tm],theirs=[...UI.tt],mk=[...UI.pm],tk=[...UI.pt];
  const cands=[
    ...roster(S.userTid).filter(p=>!UI.tm.has(p.pid)).map(p=>({key:'p:'+p.pid,label:p.name,v:tradeValue(p,mode,tid),e:()=>evalTrade(tid,[...mine,p.pid],theirs,mk,tk)})),

  const u=S.userTid;if(u==null)return;
  for(const p of S.players){
    const q=p.prom;if(!q||q.t!==u)continue;
    if(p.tid!==u){promEnd(p,false,p.tid===-1?(q.k==='ext'?'left in free agency without the extension you promised':'was let go after your promise'):`was traded after you promised him ${promText(q)}`);continue}
    if(q.k==='ext'){if(p.next||(p.contract&&p.contract.exp>q.exp))promEnd(p,true);continue}
    if(S.phase!=='regular'&&!final)continue;
    if(!final){
      if(q.k==='start'&&!p.inj)q.bad=roleOf(p)===0?0:q.bad+1;
      if(q.k==='min'&&!p.inj){const g=p.st.gp-q.g0;if(g>=6)q.bad=(p.st.min-q.m0)/g>=q.tgt-2?0:q.bad+1}
      if(q.bad>=3)promEnd(p,false,q.k==='start'?'has not been starting despite your promise':`is not getting the ${q.tgt} minutes you promised`);
    }else if(q.k==='win')promEnd(p,S.po.seeded.includes(u),'watched the team miss the playoffs after you promised a playoff team');
    else promEnd(p,true);
  }
}

function meet(p,k){

    msg=m>=85?'He thanked you. He was already in a good place.':again?'He nodded. Praise means less when it comes this often.':'He lit up. A little recognition goes a long way.'}
  else if(k==='challenge'){
    if(p.age>=30){d=-2;msg='He shrugged it off. A veteran knows who he is.'}
    else if(we>=58){d=-1;p.chal=S.season;p.chalB=.6;msg='He took it to heart and is putting in extra work. Expect it to show this summer.'}
    else if(we<42){d=-8;msg='He pushed back hard and left the meeting unhappy.'}

function futureTalk(p){
  const bits=[],parts=moodParts(p).filter(x=>x[1]<=-4).sort((a,b)=>a[1]-b[1]).slice(0,2).map(x=>x[0].toLowerCase());
  if(p.tradeReq)bits.push('He still wants out.');
  bits.push(parts.length?`What bothers him most: ${parts.join(' and ')}.`:'Nothing in particular is bothering him.');
  if(p.contract&&!p.next){
    if(extEligible(p)){const o=extOffer(p);bits.push(o.ok?`He would sign an extension now at about ${money(o.amt)} a year.`:o.why)}

  app.innerHTML=renderHeader()+renderNav()+`<main class="main wrap">${RENDER[UI.tab]()}</main>`+(S.fired?renderFired():UI.live?renderLive():UI.ask?renderAsk():UI.cer?renderCeremony():UI.wrap?renderWrap():UI.lot?renderLot():UI.player!=null?renderPlayerModal():UI.cmpOpen?renderCompare():UI.game!=null?renderGameModal():UI.offers?renderOffersModal():UI.pressShow?renderPressModal():'');
  if(UI.offers||UI.tab==='home')UI.offerViewed=Math.max(UI.offerViewed||0,...liveOffers().map(o=>o.id));
  if(S.presser&&(UI.pressShow||UI.tab==='home'))UI.pressViewed=Math.max(UI.pressViewed||0,S.presser.id||0);
  UI.offerToasted=false;offerAlert();if(!UI.offerToasted)pressAlert();
  const hdr=app.querySelector('.top');if(hdr)document.documentElement.style.setProperty('--hdr',hdr.offsetHeight+'px');
}

// ---------- events ----------
let confirmNew=0;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act,arg=el.dataset.arg,num=arg!=null?Number(arg):null;
  switch(act){
    case 'pickTeam':S.userTid=num;newOwner(num);pressMedia();news(`You took over the ${tname(num)}. Your owner: ${OWNER_TYPES[S.owner.type].toLowerCase()}.`);UI.tab='home';break;
    case 'takeJob':takeJob(num);pressMedia();break;
    case 'presser':answerPress(num);if(!S.presser)UI.pressShow=false;break;
    case 'pressShow':UI.pressShow=true;UI.offers=false;UI.player=null;UI.game=null;document.getElementById('toast').hidden=true;break;
    case 'closePress':UI.pressShow=false;break;
    case 'offerAccept':acceptOffer(num);break;
    case 'offerDecline':S.offers=S.offers.filter(o=>o.id!==num);break;
    case 'offersShow':UI.offers=true;UI.player=null;document.getElementById('toast').hidden=true;break;
    case 'closeOffers':UI.offers=false;break;
    case 'offerOpen':{const o=S.offers.find(x=>x.id===num);if(!o)break;UI.offers=false;clearTrade();UI.tview='build';UI.tradeTid=o.tid;o.tm.forEach(x=>UI.tm.add(x));o.tt.forEach(x=>UI.tt.add(x));o.pm.forEach(x=>UI.pm.add(x));o.pt.forEach(x=>UI.pt.add(x));UI.tab='trade';break}
    case 'setPrice':{const v=parseInt(document.getElementById('ticketPrice').value,10);if(!(v>=20&&v<=400)){toast('Enter an average ticket price between $20 and $400.');return}
      const t=T(S.userTid),old=t.biz.price,f=fairPrice(t),line=Math.max(old,f*1.1);t.biz.price=v;
      // pushing well past the fair price upsets fans, once per dollar raised
      if(v>line){const hit=r1(Math.min(4,(v-line)/f*10));hypeBump(S.userTid,-hit);if(hit>=.5)news(`Fans are angry about the ticket price hike to $${v} (hype -${hit}).`)}
      toast(`Ticket price set to $${v}.`);break}
    case 'upgradeArena':{const b=T(S.userTid).biz;if(b.arena>=5||b.arenaNext)return;const how=arg==='loan'?'loan':'cash',c=startArena(S.userTid,how);
      news(how==='cash'?`You started a ${money(c)} arena upgrade. It opens next season.`:`You started an arena upgrade, financed at ${money(c)} a season for ${ARENA_YEARS} seasons. It opens next season.`);break}
    case 'askOwner':askOwner(arg);break;
    case 'bizTab':UI.biz=arg;break;
    case 'bizAns':answerBiz(num);break;
    case 'promo':queuePromo(arg);break;
    case 'city':pickCity(arg);break;
    case 'sthDisc':if([.05,.15,.25].includes(num))T(S.userTid).biz.disc=num;break;
    case 'deal':{const [k,i]=arg.split(':');takeDeal(k,Number(i));break}
    case 'tab':UI.tab=arg;if(el.dataset.dpview){UI.rview='dev';UI.player=null}break;
    case 'simday':runSim('reg',1);break;
    case 'simweek':runSim('reg',7);break;
    case 'simreg':runSim('reg',999);break;
    case 'pogame':case 'poround':case 'pochamp':runSim(act,1);break;
    case 'watch':startLive();break;
    case 'askWatch':startLive();break;
    case 'askSim':if(UI.ask)runSim(UI.ask.mode,UI.ask.n,true);break;
    case 'askStop':UI.ask=null;break;
    case 'watchAsk':S.opts=S.opts||{};S.opts.watchAsk=!S.opts.watchAsk;break;
    case 'liveSpd':if(UI.live){UI.live.spd=UI.liveSpd=num;liveTick()}break;
    case 'livePause':if(UI.live){UI.live.paused=!UI.live.paused;if(!UI.live.paused)liveTick()}break;
    case 'liveEnd':liveEnd();break;
    case 'liveClose':closeLive();break;
    case 'liveBox':if(UI.live){const id=UI.live.lid;UI.resume=UI.live.rest;UI.live=null;UI.game=id}break;
    case 'cerGo':if(UI.cer)UI.cer.i=num;break;
    case 'cerOpen':if(UI.cer){const aw=S.awards.find(a=>a.s===UI.cer.s);UI.cer.open[cerCards(aw)[UI.cer.i]]=true}break;
    case 'cerSkip':if(UI.cer){const cs=cerCards(S.awards.find(a=>a.s===UI.cer.s));cs.forEach(k=>UI.cer.open[k]=true);UI.cer.i=cs.length-1}break;
    case 'cerClose':closeCer();break;
    case 'wrapGo':if(UI.wrap)UI.wrap.i=num;break;
    case 'wrapClose':closeWrap();break;
    case 'wrapReview':UI.wrap={s:num,i:0,review:true};break;
    case 'awReview':UI.cer={s:num,i:0,open:{},review:true};break;
    case 'lotOpen':if(S.lotto)UI.lot={auto:false,spd:UI.lotSpd||1};break;
    case 'lotStart':if(UI.lot){UI.lot.auto=true;lotTick()}break;
    case 'lotSpd':if(UI.lot){UI.lot.spd=UI.lotSpd=num;lotTick()}break;
    case 'lotPause':if(UI.lot){UI.lot.auto=!UI.lot.auto;lotTick()}break;
    case 'lotNext':if(UI.lot){UI.lot.auto=false;clearTimeout(UI.lot.timer);lotStep()}break;
    case 'lotSkip':if(UI.lot){UI.lot.auto=false;clearTimeout(UI.lot.timer)}else UI.lot={auto:false,spd:UI.lotSpd||1};lottoDone();break;
    case 'lotClose':closeLot();break;
    case 'toCombine':closeLot();startCombine();UI.tab='draft';break;
    case 'draftPick':draftPlayer(pById(num),S.userTid);aiDraftUntilUser();break;
    case 'autopick':aiPick();aiDraftUntilUser();break;
    case 'roleTalk':{const p=pById(num);if(!p||p.tid!==S.userTid||!wantsStart(p)||p.roleAsk===S.season||roleOK(p))break;
      p.roleAsk=S.season;
      if(rnd()<roleTalkOdds(p)){p.roleOK=S.season;p.mood=clamp(moodOf(p)+5,0,100);news(`${p.name} agreed to come off the bench and embrace a sixth-man role.`);pressRole(p,true)}
      else{p.mood=clamp(moodOf(p)-6,0,100);news(`${p.name} wants to start and didn't take the bench talk well.`);if(rnd()<.6)pressRole(p,false)}
      break}
    case 'newsF':UI.newsF=arg||'';break;
    case 'gleague':{const p=pById(num);if(p&&p.tid===S.userTid&&p.age<=24){p.gl=!p.gl;news(p.gl?`You sent ${p.name} to the G League for development minutes.`:`You recalled ${p.name} from the G League.`)}break}
    case 'combine':{const [k,id]=arg.split(':');combineAct(k,Number(id));break}
    case 'startDraft':startDraft();UI.tab='draft';break;
    case 'draftAll':while(S.phase==='draft'){aiPick();if(S.draft.idx>=S.draft.order.length)finishDraft()}break;
    case 'resign':{const p=pById(num),u=S.userTid,next=nextYearPayroll(u)+(p.resign==='yes'?0:p.ask);
      if(next>ownerLimit()){toast(`Your owner won't approve next season's payroll going to ${money(next)} (limit ${money(ownerLimit())}). Let someone go first.`);break}
      p.resign='yes';break}
    case 'extend':extend(pById(num));break;
    case 'fscout':S.fscout=!S.fscout;if(S.fscout)S.focus=(S.focus||[]).slice(0,focusCap());break;
    case 'focus':{S.focus=S.focus||[];const i=S.focus.indexOf(num);if(i>=0)S.focus.splice(i,1);else if(S.focus.length<focusCap())S.focus.push(num);break}
    case 'letgo':pById(num).resign='no';break;
    case 'toFA':toFreeAgency();UI.tab='fa';break;
    case 'faday':faDay();break;
    case 'startSeason':startSeason();break;
    case 'sign':{const p=pById(num),c=canSign(S.userTid,p);if(!c.ok){toast(c.why);break}sign(S.userTid,p,p.ask,p.askYrs);news(`You signed ${p.name}: ${p.askYrs} yr${p.askYrs>1?'s':''}, ${money(p.contract.amt)} per year.`);if(p.contract.amt>=18||pStar()===p)pressSigning(p,'sign');toast(`Signed ${p.name}.`);break}
    case 'release':{const p=pById(num);if(roster(S.userTid).length<=(S.phase==='regular'?13:0)){toast('You need at least 13 players during the season. Sign someone first.');break}release(p);break}
    case 'sort':if(UI.sort===arg)UI.sortDir*=-1;else{UI.sort=arg;UI.sortDir=arg==='name'?1:-1}break;
    case 'tm':case 'tt':case 'pm':case 'pt':{const s=UI[act];s.has(num)?s.delete(num):s.add(num);break}
    case 'tradeClear':clearTrade();break;
    case 'tradeAdd':{const [k,id]=arg.split(':');(k==='p'?UI.tm:UI.pm).add(Number(id));break}
    case 'propose':proposeTrade();UI.finder=null;break;
    case 'player':UI.player=num;break;
    case 'closePlayer':UI.player=null;break;
    case 'game':UI.game=num;UI.player=null;break;
    case 'closeGame':UI.game=null;resumeSim();break;
    case 'pbp':UI.pbpAll=arg==='1';break;
    case 'recView':UI.recView=arg;break;
    case 'rotMove':{const [id,dir]=arg.split(':').map(Number),t=T(S.userTid),rot=t.rot=t.rot||{};
      const ids=rotationFor(S.userTid,false,true).list.map(x=>x.p.pid),i=ids.indexOf(id),j=i+dir;
      if(i<0||j<0||j>=ids.length)break;[ids[i],ids[j]]=[ids[j],ids[i]];rot.order=ids;break}
    case 'rotCloser':{const t=T(S.userTid),rot=t.rot=t.rot||{};
      let cl=rot.closers&&rot.closers.length?rot.closers.slice():rotationFor(S.userTid,false,true).list.map(x=>x.p).sort((a,b)=>b.ovr-a.ovr).slice(0,5).map(p=>p.pid);
      if(cl.includes(num))cl=cl.filter(x=>x!==num);else if(cl.length<5)cl.push(num);else{toast('Five closers at most. Remove one first.');return}
      rot.closers=cl;break}
    case 'rotReset':delete T(S.userTid).rot;break;
    case 'modal':return;
    case 'findFor':case 'findShop':{
      const p=pById(num);UI.player=null;UI.tab='trade';UI.tview='build';
      if(act==='findFor'){UI.tradeTid=p.tid;findFor(num)}else findShop(num);
      if(!tradeOpen())toast('Trades are closed right now, but you can still see what would work.');
      break}
    case 'finderLoad':{const it=UI.finder.items[num];clearTrade();UI.tradeTid=it.tid;it.tm.forEach(x=>UI.tm.add(x));it.tt.forEach(x=>UI.tt.add(x));it.pm.forEach(x=>UI.pm.add(x));it.pt.forEach(x=>UI.pt.add(x));break}
    case 'finderClose':UI.finder=null;break;
    case 'tview':UI.tview=arg;break;
    case 'rview':UI.rview=arg;break;
    case 'meet':{const [a,b]=arg.split(':');meet(pById(Number(a)),b);break}
    case 'devRep':UI.devRep=!!arg;break;
    case 'luClose':{const ids=arg.split('-').map(Number).filter(id=>{const p=pById(id);return p&&p.tid===S.userTid});if(ids.length===5){const t=T(S.userTid),rot=t.rot=t.rot||{};rot.closers=ids;toast('New closers set. They finish close games.')}break}
    case 'promise':{const [a,b]=arg.split(':');makePromise(pById(Number(a)),b);break}
    case 'blk':{const [a,b]=arg.split(':');setBlk(pById(Number(a)),b||'');break}
    case 'rpos':{const i=UI.rpos.indexOf(arg);i<0?UI.rpos.push(arg):UI.rpos.splice(i,1);break}
    case 'faPos':{const i=UI.faPos.indexOf(arg);i<0?UI.faPos.push(arg):UI.faPos.splice(i,1);break}
    case 'faSkill':UI.faSkill=UI.faSkill===arg?'':arg;if(UI.faSkill){UI.sort=arg;UI.sortDir=-1}break;
    case 'faClear':UI.faPos=[];UI.faSkill='';break;
    case 'cmp':{const i=UI.cmp.indexOf(num);if(i>=0)UI.cmp.splice(i,1);else{UI.cmp.push(num);if(UI.cmp.length>2)UI.cmp.shift()}
      if(UI.cmp.length===2){UI.cmpOpen=true;UI.player=null}
      else if(i<0)toast(`Comparing ${pById(num).name}. Pick a second player: Compare on the Roster tab or on any player's page.`);break}
    case 'closeCmp':UI.cmpOpen=false;UI.cmp=[];break;
    case 'cmpClear':UI.cmpOpen=false;UI.cmp=[];break;
    case 'needGo':{const [w,k,v]=arg.split('|');
      if(w==='cap')UI.tab='cap';
      else if(w==='tf'){UI.tf={...TF_DEF,pos:[]};const f=UI.tf;f.healthy=true;
        if(k==='pos'){f.pos=[v];f.upgrade=true}else if(k==='skill'){f.skill=v;f.sort='sk'}else if(k==='age')f.ageMax=v;
        UI.tview='search';UI.tab='trade'}
      else{UI.faPos=k==='pos'?[v]:[];UI.faSkill=k==='skill'?v:'';if(UI.faSkill){UI.sort=v;UI.sortDir=-1}UI.tab='fa'}
      window.scrollTo(0,0);break}
    case 'tfPos':{const f=tfState(),i=f.pos.indexOf(arg);i<0?f.pos.push(arg):f.pos.splice(i,1);f.n=TF_DEF.n;break}
    case 'tfReset':{const f=tfState();UI.tf={...TF_DEF,pos:[],sort:f.sort,dir:f.dir};break}
    case 'tfMore':tfState().n+=40;break;
    case 'tfSort':{const f=tfState();if(f.sort===arg)f.dir*=-1;else{f.sort=arg;f.dir=arg==='name'||arg==='price'?1:-1}break}
    case 'tradeFor':{
      const p=pById(num);if(!p||p.tid<0||p.tid===S.userTid)break;
      if(UI.tradeTid!==p.tid){UI.tradeTid=p.tid;UI.tt.clear();UI.pt.clear()}
      UI.tt.add(num);UI.tview='build';findFor(num);
      if(!tradeOpen())toast('Trades are closed right now, but you can still see what would work.');
      requestAnimationFrame(()=>window.scrollTo(0,0));break}
    case 'statView':UI.statView=arg;break;
    case 'statMine':UI.statMine=arg==='1';break;
    case 'ssort':if(UI.ss===arg)UI.sd*=-1;else{UI.ss=arg;UI.sd=1}break;
    case 'renounce':UI.renounce.has(num)?UI.renounce.delete(num):UI.renounce.add(num);break;
    case 'planAdd':{const v=parseFloat(document.getElementById('planAmt').value);if(!(v>0)){toast('Enter a salary in millions, like 25.');return}UI.planAdds.push(r1(clamp(v,MINSAL,MAXSAL)));break}
    case 'planDel':UI.planAdds.splice(num,1);break;
    case 'staffRole':UI.staffRole=arg;break;
    case 'hireStaff':hireStaff(num);break;
    case 'fireStaff':
      if(UI.confirm!==act+arg||Date.now()-UI.confirmT>4000){UI.confirm=act+arg;UI.confirmT=Date.now();el.textContent='Click again to fire';return}
      UI.confirm=null;fireStaff(arg);break;
    case 'scheme':{const [k,o]=arg.split(':');setScheme(k,o);break}
    case 'devFocus':T(S.userTid).devFocus=arg||null;break;
    case 'newCareer':
      if(Date.now()-confirmNew>4000){confirmNew=Date.now();el.textContent='Click again to erase this career';return}
      newLeague();UI.tab='home';break;
    default:return;
  }
  save();render();
});
// chart tooltips: any element with data-tip; chart columns also move the crosshair
function showTip(el){
  const tip=document.getElementById('tip');if(!el){tip.hidden=true;document.querySelectorAll('.xh').forEach(x=>x.setAttribute('visibility','hidden'));return}
  tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';
  const xh=el.dataset.x&&el.closest('svg')&&el.closest('svg').querySelector('.xh');if(xh){xh.setAttribute('x1',el.dataset.x);xh.setAttribute('x2',el.dataset.x);xh.setAttribute('visibility','visible')}
}
document.addEventListener('mouseover',e=>showTip(e.target.closest&&e.target.closest('[data-tip]')));
document.addEventListener('scroll',()=>showTip(null),true);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(UI.live){closeLive();save()}else if(UI.ask)UI.ask=null;else if(UI.cer){closeCer();save()}else if(UI.wrap){closeWrap();save()}else if(UI.lot)closeLot();else if(UI.player!=null)UI.player=null;else if(UI.game!=null){UI.game=null;if(UI.resume){resumeSim();save()}}else if(UI.offers)UI.offers=false;else if(UI.pressShow)UI.pressShow=false;else return;render()});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='tradeTeam'){UI.tradeTid=Number(el.value);UI.tt.clear();UI.pt.clear();render();return}
  if(el.dataset.tf){const f=tfState(),k=el.dataset.tf;f[k]=el.type==='checkbox'?el.checked:el.value.trim();f.n=TF_DEF.n;render();return}
  if(el.dataset.dp){setPlan(pById(Number(el.dataset.dp)),el.value);save();render();return}
  if(el.dataset.dpi){const p=pById(Number(el.dataset.dpi)),d=planOf(p);if(d)setPlan(p,d.k,el.value);save();render();return}
  if(!(el.id==='rotDepth'||el.id==='rotRest'||el.id==='rotRamp'||el.classList.contains('rot-min')))return;
  const t=T(S.userTid),rot=t.rot=t.rot||{};
  if(el.id==='rotDepth')rot.depth=Number(el.value);
  else if(el.id==='rotRest')rot.rest=el.value||undefined;
  else if(el.id==='rotRamp')rot.ramp=el.checked?undefined:false;
  else{const v=el.value.trim(),pid=Number(el.dataset.pid);rot.mins=rot.mins||{};
    if(v==='')delete rot.mins[pid];else{const n=Number(v);if(!(n>=0&&n<=44)){toast('Minute targets run from 0 to 44.');render();return}rot.mins[pid]=Math.round(n)}}
  save();render();
});

// ---------- boot ----------
S=load();
if(!S||!S.teams){newLeague();save()}
if(!S.awards)S.awards=[];
if(!S.rec)S.rec=newRec(S.season); // saves from before the records book
if(!S.cupHist)S.cupHist=[];
if(!S.pressMem)S.pressMem=newPressMem();
S.players.filter(p=>p.tid===-2).forEach(decorateProspect); // prospects from before backgrounds
syncFc(); // saves from before future classes
if(S.presser&&S.presser.prio==null)S.presser=null; // old-format question from before the press rewrite
if(!S.riv){S.offers=[];S.nextOfferId=1;S.tick=0;S.presser=null;S.hof=[];seedRivalries()} // saves from before media
if(!S.staffPool){S.staffPool=[];S.nextStaffId=1;setupStaff()} // saves from before staff
if(!S.teams[0].biz)setupBusiness(); // saves from before finances
S.teams.forEach(t=>{const b=t.biz;if(!b.loans)b.loans=[];if(!b.deals)seedDeals(t);if(b.fin.rev.sponsors==null)b.fin.rev.sponsors=0;if(b.loyal==null)seedFans(t)}); // saves from before sponsors
if(!S.dealOffers)S.dealOffers={};
if(!S.chem)settleAll(); // saves from before chemistry: current rosters count as settled
S.staffPool.concat(...S.teams.map(t=>ROLES.map(([r])=>t.staff[r]).filter(Boolean))).forEach(s=>{if(!s.trait)s.trait=pickTrait(s.role)}); // saves from before staff traits
S.teams.forEach(t=>{if(t.voice==null)t.voice=startVoice(t.staff.hc);if(t.sfam==null)t.sfam=1});
recoverNames();keepNames(S.awards.flatMap(a=>[...AWARDS.map(([k])=>a[k]),a.fmvp,...(a.allNba||[]).flat(),...(a.allDef||[]).flat(),...(a.allRook||[]).flat()])); // saves from before names were kept
if(S.userTid!=null&&!S.owner)newOwner(S.userTid);
if(!S.picks){ // saves from before pick trading: give every team its own picks
  S.picks=[];S.nextPickId=1;
  const first=(S.phase==='draft'||S.phase==='resign')?S.season+1:S.season;
  for(let y=0;y<4;y++)addPicks(first+y);
  save();
}
render();
</script>
