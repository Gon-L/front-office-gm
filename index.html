<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Front Office GM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky scoreboard header with phase actions, scrollable tab strip, one working panel per tab */
:root{
  --bg:#eceff4; --surface:#ffffff; --sunk:#f4f6f9; --ink:#141a24; --muted:#5b6577; --line:#d6dbe4;
  --accent:#2244c9; --accent-ink:#ffffff; --you:#fff1e6; --you-line:#e8772e;
  --good:#17804a; --bad:#bf3229; --warn:#a86a00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e5e9f0; --muted:#97a1b3; --line:#283243;
  --accent:#7f99ff; --accent-ink:#0b1020; --you:#2a1d14; --you-line:#f0934f;
  --good:#4cc283; --bad:#ff7a6e; --warn:#e2a93b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e5e9f0; --muted:#97a1b3; --line:#283243;
  --accent:#7f99ff; --accent-ink:#0b1020; --you:#2a1d14; --you-line:#f0934f;
  --good:#4cc283; --bad:#ff7a6e; --warn:#e2a93b; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.5rem}
h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
button,select{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.45rem .8rem;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:.2rem .55rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.4rem .6rem;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem;padding-block:.65rem}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.chip{display:inline-grid;place-items:center;min-width:2.6em;height:1.9em;padding:0 .35em;border-radius:4px;color:#fff;font-family:var(--display);font-weight:700;letter-spacing:.04em;font-size:.95rem}
.brand .tn{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.1}
.brand .sub{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.score{display:flex;gap:1.1rem;align-items:baseline}
.score div{display:flex;flex-direction:column}
.score b{font-family:var(--display);font-size:1.5rem;line-height:1}
.score span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-left:auto}
.capbar{flex-basis:100%;display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:var(--muted)}
.meter{position:relative;flex:1;max-width:420px;height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter i.over{background:var(--warn)} .meter i.tax{background:var(--bad)}
.meter u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}

.tabs{display:flex;gap:.2rem;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs .wrap{display:flex;gap:.15rem;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);padding:.6rem .7rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--you-line)}
/* the tab strip stays under the header while you scroll */
nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr0,0px));z-index:5}
/* phones: bottom tab bar + More sheet instead of the strip */
.botbar{display:none}
.more-sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.more-sheet .btn{text-align:left;padding:.7rem .8rem}
.more-sheet .btn.on{border-color:var(--you-line);background:var(--you)}
/* wide tables: a shadow on the side that has more columns */
.scroll.more-r{box-shadow:inset -14px 0 12px -12px rgb(0 0 0 / .35)}
.scroll.more-l{box-shadow:inset 14px 0 12px -12px rgb(0 0 0 / .35)}
.scroll.more-l.more-r{box-shadow:inset -14px 0 12px -12px rgb(0 0 0 / .35),inset 14px 0 12px -12px rgb(0 0 0 / .35)}
@media (max-width:640px){
  .top .wrap{gap:.35rem .6rem;padding-block:.45rem}
  .brand{flex:1 1 0;min-width:0}.brand>div{min-width:0}
  .brand .tn{font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .chip{font-size:.8rem;min-width:2.4em}
  .score{gap:.55rem;flex:none}.score b{font-size:1.05rem}.score span{font-size:.58rem;letter-spacing:.06em}
  .actions{flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;margin-left:0;scrollbar-width:none;padding-bottom:1px}
  .actions::-webkit-scrollbar{display:none}
  .actions .btn{padding:.35rem .6rem;font-size:.86rem;flex:none}
  .actions .btn.primary{order:-1}
  .actions .set-btn{display:none}
  .capbar{font-size:.72rem;gap:.45rem}.capbar .cap-lines{display:none}.meter{height:6px}
  nav.tabs{display:none}
  .botbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .botbar button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:.78rem;padding:.55rem .2rem .6rem;border-top:3px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .botbar button.on{color:var(--ink);border-top-color:var(--you-line)}
  body{padding-bottom:calc(3.2rem + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(3.7rem + env(safe-area-inset-bottom,0px))}
}
.main{padding-block:1.2rem 3rem;display:grid;gap:1.2rem}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1.2rem}
.grid2>*{min-width:0}

.panel p{margin:0;max-width:75ch}

.own-id{display:flex;gap:.75rem;align-items:center}.own-id h2{margin:0}
.own-av{display:inline-grid;place-items:center;flex:none;width:2.8rem;height:2.8rem;border-radius:50%;color:#fff;font-family:var(--display);font-weight:700;letter-spacing:.03em}
.own-q{font-style:italic}.own-log li{display:block}
.job-offers{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))}.job-card{border:1px solid var(--line);border-radius:10px;padding:.75rem;display:grid;gap:.35rem;align-content:start}
.job-card small{display:block}.job-card .row{margin:0}.iv-q{font-size:1.05rem}
.own-meters{display:flex;gap:1.2rem;flex-wrap:wrap}.own-bars{display:grid;grid-template-columns:1fr 1fr;gap:.4rem 1rem}@media(max-width:520px){.own-bars{grid-template-columns:1fr}}

.news{margin:0;padding:0;list-style:none;display:grid;gap:.4rem;font-size:.9rem}

.news li span:first-child{color:var(--muted);min-width:4.4em;flex:none;font-variant-numeric:tabular-nums;font-size:.82rem;padding-top:.08rem}
/* Home: news sits beside the main column on wide screens, right under the desk callout on narrow ones */
.home,.home-top,.home-rest{display:grid;gap:1.2rem;min-width:0}

.modal.wide{width:min(1100px,100%)}

.pbp.lv-feed{max-height:20rem} .lv-feed .clk{white-space:nowrap} .pbp.lv-feed li{grid-template-columns:5.2em auto 1fr auto}

.pick{display:flex;gap:.7rem;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.7rem;border-radius:8px;cursor:pointer}
.pick:hover{border-color:var(--you-line)}

.modal-bg{position:fixed;inset:0;z-index:30;background:rgb(6 9 15 / .62);display:grid;place-items:start center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

  MIA:[.42,27,20],MIL:[1.84,22,0],MIN:[-1.10,38,44],NOP:[1.69,29,2],NYK:[-.67,24,48],OKC:[-1.13,63,100],ORL:[-.27,37,42],PHI:[-.65,31,85],
  PHX:[1.80,26,2],POR:[-.90,27,8],SAC:[2.17,18,0],SAS:[-1.79,58,92],TOR:[-1.48,29,38],UTA:[1.38,33,0],WAS:[-1.69,38,49]};

const DIFF_OWN={win:2.15,profit:1.01},DIFF_TR={meddler:.09,handsoff:-.25,pinch:-.06,spender:-.21,showman:.07,impatient:.53,loyal:-.2,competitor:.02};
const DIFF_JOB=['Low','Moderate','High','Very high','Extreme'],DIFF_BUILD=['Easy','Fair','Hard','Very hard','Extreme'];
const diffDots=n=>'●'.repeat(n)+'○'.repeat(5-n);
function diffOf(tid,ctx){
  const t=T(tid),d=DIFF_T[t.abbr],o=ownId(tid);if(!d||!o)return null;
  const rel=teamOvr(tid)-ctx.avg;
  const z=d[0]-.88+(DIFF_OWN[o.type]||0)+o.tr.reduce((s,k)=>s+(DIFF_TR[k]||0),0)+(o.type==='win'?-.18*rel:0);
  const fire=1/(1+Math.exp(-z));
  return {fire,job:fire<.2?1:fire<.4?2:fire<.6?3:fire<.8?4:5,build:d[1]>=48?1:d[1]>=36?2:d[1]>=28?3:d[1]>=22?4:5,wins:d[1],deep:d[2],why:diffWhy(tid,o,ctx)};
}
// the three biggest reasons, from the owner and from the roster, cap and picks; true = it helps
function diffWhy(tid,o,ctx){
  const w=[],rk=ctx.rk[tid],top8=roster(tid).sort((a,b)=>b.ovr-a.ovr).slice(0,8),age=top8.reduce((s,p)=>s+p.age,0)/Math.max(1,top8.length);

  else w.push(['Bottom-line owner',false,.8]);
  if(o.tr.includes('impatient'))w.push(['Impatient',false,.55]);
  if(o.tr.includes('handsoff'))w.push(['Hands-off owner',true,.3]);
  if(o.tr.includes('loyal'))w.push(['Loyal owner',true,.25]);
  if(o.tr.includes('spender'))w.push(['Big spender',true,.25]);
  if(rk<=5)w.push([`Top-5 roster (#${rk})`,true,1.4]);else if(rk>=24)w.push([`Roster ranks #${rk}`,false,1.4]);
  if(age>=29.5)w.push([`Old core (top 8 avg ${age.toFixed(1)})`,false,1]);else if(age<=25.5)w.push([`Young core (top 8 avg ${age.toFixed(1)})`,true,.7]);

  const own=S.picks.filter(k=>k.rd===1&&k.owner===tid).length,owed=S.picks.filter(k=>k.rd===1&&k.orig===tid&&k.owner!==tid).length;
  if(own>=10)w.push([`${own} firsts in the next ${PICK_YRS} drafts`,true,.7]);

    return {kind:'reg',h:g.h,a:g.a,record:true,label:`${S.season} regular season, day ${S.day+1}`,tags,big:!!(g.tv||riv)};

    return {kind:'po',h:g.a,a:g.b,record:false,label:`${S.season} play-in · ${tag}`,tags:['Play-in'],big:true};

// chart tooltips: any element with data-tip; chart columns also move the crosshair
function showTip(el){
  const tip=document.getElementById('tip');if(!el){tip.hidden=true;document.querySelectorAll('.xh').forEach(x=>x.setAttribute('visibility','hidden'));return}
  tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';
  const xh=el.dataset.x&&el.closest('svg')&&el.closest('svg').querySelector('.xh');if(xh){xh.setAttribute('x1',el.dataset.x);xh.setAttribute('x2',el.dataset.x);xh.setAttribute('visibility','visible')}
}
document.addEventListener('mouseover',e=>showTip(e.target.closest&&e.target.closest('[data-tip]')));
document.addEventListener('scroll',e=>{showTip(null);if(e.target.classList&&e.target.classList.contains('scroll'))scrollHint(e.target)},true);
addEventListener('resize',()=>scrollHints());
// a shadow on whichever side of a wide table still has columns to scroll to
function scrollHint(el){const m=el.scrollWidth-el.clientWidth;el.classList.toggle('more-r',m>2&&el.scrollLeft<m-2);el.classList.toggle('more-l',m>2&&el.scrollLeft>2)}
function scrollHints(){document.querySelectorAll('.scroll').forEach(scrollHint)}
// touch screens have no hover: a tap on anything with a tooltip (that isn't a button) shows it
document.addEventListener('click',e=>{
  if(!matchMedia('(hover: none)').matches)return;
  const el=e.target.closest&&e.target.closest('[title]');
  if(!el||el.closest('button,[data-act],a,input,select,label')){return}
  const tip=document.getElementById('tip');tip.textContent=el.getAttribute('title');tip.hidden=false;
  const r=el.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.hidden=true,4000);
},true);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(UI.live){closeLive();save()}else if(UI.ask)UI.ask=null;else if(UI.cer){closeCer();save()}else if(UI.wrap){closeWrap();save()}else if(UI.lot)closeLot();else if(UI.player!=null)UI.player=null;else if(UI.game!=null){UI.game=null;if(UI.resume){resumeSim();save()}}else if(UI.offers)UI.offers=false;else if(UI.pressShow)UI.pressShow=false;else if(UI.bizShow)UI.bizShow=false;else if(UI.ownShow)UI.ownShow=false;else if(UI.alerts)UI.alerts=false;else if(UI.settings)UI.settings=false;else if(UI.more)UI.more=false;else return;render()});
document.addEventListener('dragstart',e=>{const tr=e.target.closest&&e.target.closest('.rot-tbl tr[data-rpid]');if(!tr)return;UI.rotDrag=Number(tr.dataset.rpid);e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',tr.dataset.rpid)}catch(_){}});
document.addEventListener('dragover',e=>{if(UI.rotDrag==null)return;const tr=e.target.closest&&e.target.closest('.rot-tbl tr[data-rpid]');document.querySelectorAll('.rot-tbl tr.drop').forEach(x=>x!==tr&&x.classList.remove('drop'));if(!tr)return;e.preventDefault();tr.classList.add('drop')});
document.addEventListener('drop',e=>{if(UI.rotDrag==null)return;const tr=e.target.closest&&e.target.closest('.rot-tbl tr[data-rpid]');const a=UI.rotDrag;UI.rotDrag=null;if(!tr)return;e.preventDefault();if(rotSwap(a,Number(tr.dataset.rpid),true)){UI.rotSel=null;save()}render()});
document.addEventListener('dragend',()=>{if(UI.rotDrag==null)return;UI.rotDrag=null;document.querySelectorAll('.rot-tbl tr.drop').forEach(x=>x.classList.remove('drop'))});
document.addEventListener('input',e=>{
  if(e.target.id!=='draftQ')return;
  const el=e.target,pos=el.selectionStart;UI.dq=el.value;render();
  const n=document.getElementById('draftQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='importSave'){if(el.files&&el.files[0])importSave(el.files[0]);return}
  if(UI.neg&&['negAmt','negYrs','negOpt'].includes(el.id)){negRead();const s=document.getElementById('negSum'),p=pById(UI.neg.pid);if(s&&p)s.innerHTML=negSummary(p,UI.neg);return}
  if(el.id==='tradeTeam'){UI.tradeTid=Number(el.value);UI.tt.clear();UI.pt.clear();UI.cash=0;render();return}
  if(el.id==='tradeCash'){UI.cash=Number(el.value)||0;render();return}
  if(el.dataset.prot){UI.prot=UI.prot||{};const v=Number(el.value);if(v)UI.prot[el.dataset.prot]=v;else delete UI.prot[el.dataset.prot];render();return}
  if(el.dataset.tf){const f=tfState(),k=el.dataset.tf;f[k]=el.type==='checkbox'?el.checked:el.value.trim();f.n=TF_DEF.n;render();return}
  if(el.dataset.dp){setPlan(pById(Number(el.dataset.dp)),el.value);save();render();return}
  if(el.dataset.dpi){const p=pById(Number(el.dataset.dpi)),d=planOf(p);if(d)setPlan(p,d.k,el.value);save();render();return}
  if(!(['rotDepth','rotRest','rotRamp','rotMode','rotPo'].includes(el.id)||el.classList.contains('rot-min')||el.classList.contains('rot-cap')||el.classList.contains('rot-bk')))return;
  const t=T(S.userTid),rot=t.rot=t.rot||{};
  if(el.id==='rotDepth')rot.depth=Number(el.value)||undefined;
  else if(el.id==='rotRest')rot.rest=el.value||undefined;
  else if(el.id==='rotRamp')rot.ramp=el.checked?undefined:false;
  else if(el.id==='rotMode'){rot.mode=el.value||undefined;const c=stratCoach();if(rot.mode)toast(`Strategy: ${ROT_MODES[rot.mode]}.${c>0?' Your coach is on board.':c<0?' Your coach is skeptical.':''}`)}
  else if(el.id==='rotPo')rot.po=el.value===''?undefined:el.value==='same'?'same':Number(el.value);
  else if(el.classList.contains('rot-bk')){const s=Number(el.dataset.pid);rot.backup=rot.backup||{};if(el.value)rot.backup[s]=Number(el.value);else delete rot.backup[s]}
  else if(el.classList.contains('rot-cap')){const v=el.value.trim(),pid=Number(el.dataset.pid);rot.cap=rot.cap||{};
    if(v==='')delete rot.cap[pid];else{const n=Number(v);if(!(n>=10&&n<=44)){toast('Minute caps run from 10 to 44.');render();return}rot.cap[pid]=Math.round(n)}}
  else{const v=el.value.trim(),pid=Number(el.dataset.pid);rot.mins=rot.mins||{};
    if(v==='')delete rot.mins[pid];else{const n=Number(v);if(!(n>=0&&n<=44)){toast('Minute targets run from 0 to 44.');render();return}rot.mins[pid]=Math.round(n)}}
  save();render();
});

// ---------- boot ----------
S=load();
if(!S||!S.teams){newLeague();save()}
if(!S.awards)S.awards=[];
if(!S.rec)S.rec=newRec(S.season); // saves from before the records book
if(!S.cupHist)S.cupHist=[];
if(!S.pressMem)S.pressMem=newPressMem();
S.players.filter(p=>p.tid===-2).forEach(decorateProspect); // prospects from before backgrounds
if(!S.picks){ // saves from before pick trading: give every team its own picks
  S.picks=[];S.nextPickId=1;
  const first=(S.phase==='draft'||S.phase==='resign')?S.season+1:S.season;
  for(let y=0;y<PICK_YRS;y++)addPicks(first+y);
  save();
}
syncFc(); // saves from before future classes
if(S.presser&&S.presser.prio==null)S.presser=null; // old-format question from before the press rewrite
if(!S.riv){S.offers=[];S.nextOfferId=1;S.tick=0;S.presser=null;S.hof=[];seedRivalries()} // saves from before media
if(!S.staffPool){S.staffPool=[];S.nextStaffId=1;setupStaff()} // saves from before staff
if(!S.teams[0].biz)setupBusiness(); // saves from before finances
S.teams.forEach(t=>{const b=t.biz;if(!b.loans)b.loans=[];if(!b.deals)seedDeals(t);if(b.fin.rev.sponsors==null)b.fin.rev.sponsors=0;if(b.loyal==null)seedFans(t)}); // saves from before sponsors
if(!S.dealOffers)S.dealOffers={};
if(!S.cl){seedClauses();S.cl=1} // saves from before trade kickers and no-trade clauses
if(!S.chem)settleAll(); // saves from before chemistry: current rosters count as settled
S.staffPool.concat(...S.teams.map(t=>ROLES.map(([r])=>t.staff[r]).filter(Boolean))).forEach(s=>{if(!s.trait)s.trait=pickTrait(s.role)}); // saves from before staff traits
S.teams.forEach(t=>{if(t.voice==null)t.voice=startVoice(t.staff.hc);if(t.sfam==null)t.sfam=1});
recoverNames();keepNames(S.awards.flatMap(a=>[...AWARDS.map(([k])=>a[k]),a.fmvp,...(a.allNba||[]).flat(),...(a.allDef||[]).flat(),...(a.allRook||[]).flat()])); // saves from before names were kept
seedOwners(); // saves from before named owners: your owner keeps the type you already had
if(S.userTid!=null&&S.owner){const o=S.owner,id=T(S.userTid).own;if(o.nrev==null){id.type=o.type;o.nrev=o.hist.filter(h=>h.tid===S.userTid).length;o.log=o.log||[];o.pl=o.pl||[]}}
if(S.userTid!=null&&!S.owner)newOwner(S.userTid);
if(S.owner&&!S.owner.deal){gmDeal();if(!career().jobs.length)career().jobs.push({tid:S.userTid,from:S.owner.deal.s0,owner:ownName(),sal:S.owner.deal.sal})}
if(S.lotto&&!S.lotto.b){S.lotto.b=S.lotto.seeds.map((_,i)=>OLD_W[i]||5);S.lotto.old=1;S.lotto.rel=[];S.lotto.bar=[];S.lotto.grp=[]}
render();
</script>
